#
# .github/config/cliff.toml

[changelog]
# Header des Changelogs
header = """
# Changelog

All notable changes to this project will be documented in this file.

This format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project follows [Semantic Versioning](https://semver.org/).
"""

# Template für jede Release-Version
body = """
{% if version %}\
## [{{ version }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {% if commit.breaking %}🚨 {% endif %}{{ commit.message | upper_first }} ([`{{ commit.id | truncate(length=7, end="") }}`](https://github.com/jmuelbert/jm-github-standards/commit/{{ commit.id }})){% if commit.breaking %} - **BREAKING**{% endif %}
{%- endfor %}
{% endfor %}\n
"""

# Footer des Changelogs
footer = """
<!-- generated by git-cliff -->
"""

[git]
conventional_commits = true
filter_commits = true

commit_parsers = [
  # Dependabot-Commits anhand des Autors ausfiltern
  { field = "author.name", pattern = "dependabot\\[bot\\]", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^build\\(deps", skip = true },

  # Den automatischen Changelog-Commit nicht übernehmen
  { message = "^docs: update changelog", skip = true },

  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactoring" },
  { message = "^test", group = "Testing" },
  { message = "^chore", skip = true },
]

# Tags, die nicht dem Schema folgen, ignorieren
skip_tags = "v0\\.0\\.|beta|alpha|rc"
