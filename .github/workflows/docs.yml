name: Deploy documentation

# yamllint disable-line rule:truthy
on:
  push:
    branches: [main]
    paths:
      - docs/**
      - astro.config.*
      - .github/workflows/docs.yml
  workflow_dispatch:

# Nur ein Deployment gleichzeitig, laufende Deployments nicht abbrechen
concurrency:
  group: pages
  cancel-in-progress: false

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  docs:
    name: Documentation
    uses: jmuelbert/jm-github-standards/.github/workflows/shared-docs-astro.yml@3dcfd848f51de83bf4fcbfd8c3d0d9cb37923077 #v3.0.0
    permissions:
      contents: read
      pages: write
      id-token: write
    with:
      build_command: pnpm docs:build
      output_dir: docs/dist
