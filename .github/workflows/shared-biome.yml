name: Shared Biome Code Quality

on:
  workflow_call:
    inputs:
      biome_version:
        description: The version of Biome to use. Defaults to latest.
        type: string
        required: false
        default: latest

# Required permissions
# permissions:
#   contents: read

jobs:
  biome:
    name: Biome Check
    runs-on: ubuntu-latest
    steps:
      - name: 🔒 Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: 🧰 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7,1
        with:
          version: ${{ inputs.biome_version }}

      # 'biome ci' prüft Formatierung, Linting und Organize Imports in einem Rutsch
      - name: Run Biome CI
        run: biome ci .
