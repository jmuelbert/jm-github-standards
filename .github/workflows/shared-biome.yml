name: Shared Biome Code Quality

on:
  workflow_call:
    inputs:
      biome_version:
        description: The version of Biome to use. Defaults to latest.
        type: string
        required: false
        default: latest

# Required permissions
# permissions:
#   contents: read

jobs:
  biome:
    name: Biome Check
    runs-on: ubuntu-latest
    steps:
      - name: 🔒 Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: 🧰 Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Biome
        uses: biomejs/setup-biome@4c91541eaada48f67d7dbd7833600ce162b68f51 # v2.7,1
        with:
          version: ${{ inputs.biome_version }}

      # 'biome ci' prüft Formatierung, Linting und Organize Imports in einem Rutsch
      - name: Run Biome CI
        run: biome ci .
