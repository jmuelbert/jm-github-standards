name: Governance trigger

# yamllint disable-line rule:truthy
on:
  issues:
    types: [opened, reopened, labeled]
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  governance:
    permissions:
      contents: read
      pull-requests: write
      issues: write
      security-events: write
    uses: jmuelbert/jm-github-standards/.github/workflows/shared-governance.yml@9d6401a4329d7ec61ee987fdcf05ca2b369cea27 #v2.5.0
