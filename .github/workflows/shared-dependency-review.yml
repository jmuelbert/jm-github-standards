name: Shared dependency review

# yamllint disable-line rule:truthy
on:
  workflow_call:

# Required permissions
# permissions:
#   contents: read
#   pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    steps:
      - name: 🔒 Harden Runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: 🧰 Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: 🔄 Pull Central Dependency Review Config
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: jmuelbert/jm-github-standards
          ref: main
          path: central-defaults # Load the files from that sub-folder
          sparse-checkout: |
            .github/config/dependency-review-config.yml
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 🔍 Dependency review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          config-file: ./central-defaults/.github/config/dependency-review-config.yml
          base-ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          head-ref: ${{ github.event.pull_request.head.sha || github.sha }}
