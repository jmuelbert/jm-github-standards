name: Shared Scorecard

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      publish_results:
        description: Publish results to OpenSSF
        type: boolean
        default: true
    secrets:
      SCORECARD_TOKEN:
        description: Fine-grained PAT with read access to repo settings
        required: false

# Required permissions
# permissions:
#   contents: read
#   actions: read
#   security-events: write # Needed for Code scanning upload
#   id-token: write # Needed for OIDC token
#   pull-requests: read # Recommended for PR events

jobs:
  analyze:
    name: Run Scorecard analysis
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 🔒 Harden Runner
        uses: step-security/harden-runner@aebdcf6156ab6691adf63218240e476564a1ed4c # v2.23.0
        with:
          egress-policy: audit

      - name: 🧰 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🔍 Run Scorecard analysis
        id: scorecard
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          repo_token: ${{ secrets.SCORECARD_TOKEN || secrets.GITHUB_TOKEN }}
          publish_results: ${{ inputs.publish_results }}

      # Upload the results to GitHub's code scanning dashboard.
      - name: 📤 Upload to code-scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: scorecard.sarif
