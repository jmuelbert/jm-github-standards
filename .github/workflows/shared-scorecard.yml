name: Shared Scorecard

# yamllint disable-line rule:truthy
on:
  workflow_call:
    inputs:
      publish_results:
        description: Publish results to OpenSSF
        type: boolean
        default: true
    secrets:
      SCORECARD_TOKEN:
        description: Fine-grained PAT with read access to repo settings
        required: false

# Required permissions
# permissions:
#   contents: read
#   actions: read
#   security-events: write # Needed for Code scanning upload
#   id-token: write # Needed for OIDC token
#   pull-requests: read # Recommended for PR events

jobs:
  analyze:
    name: Run Scorecard analysis
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 🔒 Harden Runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: 🧰 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🔍 Run Scorecard analysis
        id: scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          repo_token: ${{ secrets.SCORECARD_TOKEN || secrets.GITHUB_TOKEN }}
          publish_results: ${{ inputs.publish_results }}

      # Upload the results to GitHub's code scanning dashboard.
      - name: 📤 Upload to code-scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: scorecard.sarif
