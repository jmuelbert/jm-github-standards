name: Shared Governance

# yamllint disable-line rule:truthy
on:
  workflow_call:

# Required permissions
# permissions:
#   contents: read
#   pull-requests: write
#   issues: write
#   security-events: write

defaults:
  run:
    shell: bash

jobs:
  # --- ISSUE MANAGEMENT ---
  process-issue:
    if: github.event_name == 'issues' || github.event_name == 'issue_comment'
    runs-on: ubuntu-latest
    steps:
      - name: 🔒 Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: 🧰 Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 🏛 Checkout standards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          repository: jmuelbert/jm-github-standards
          path: .jm-github-standards

      - name: 🚀 Run issue automation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const { default: handleIssue } = await import('${{ github.workspace }}/.jm-github-standards/.github/scripts/issue-handler.js');
            await handleIssue({ github, context, core });

  # --- PR AUTOMATION ---
  analyze-pr:
    if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: 🔒 Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: 🧰 Checkout project
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 🏛 Checkout standards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jmuelbert/jm-github-standards
          path: .jm-github-standards
          persist-credentials: false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
          cache-dependency-path: .jm-github-standards/pnpm-lock.yaml

      - name: 🛠 Install Tooling
        run: pnpm install --frozen-lockfile
        working-directory: .jm-github-standards

      - name: 📏 Validate commits
        run: |
          pnpm --prefix .jm-github-standards commitlint \
            --from "remotes/origin/${GITHUB_BASE_REF}" \
            --to HEAD \
            --verbose

      - name: 🔍 Malware Scan (Malcontent)
        id: malcontent
        if: github.event_name == 'pull_request' && success() || failure()
        uses: chainguard-dev/malcontent-action@053384afe0bb069ba7e2996bd8c0863731406002 # v0.4
        with:
          fail-on-increase: false

      - name: 📤 Upload SARIF
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        if: always() && steps.malcontent.outcome == 'success'
        with:
          sarif_file: ${{ steps.malcontent.outputs.sarif-file }}
          category: malcontent

      - name: 🏷️ Apply scope labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .jm-github-standards/.github/config/labeler.yml

      - name: 📝 Run PR automation script
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        id: pr-script
        with:
          script: |
            const { default: automatePR } = await import('${{ github.workspace }}/.jm-github-standards/.github/scripts/pr-automation.js');
            await automatePR({ github, context, core });
