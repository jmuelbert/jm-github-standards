name: Dependabot trigger

# yamllint disable-line rule:truthy
on:
  pull_request:
    types: [opened, reopened, synchronize]
  pull_request_review:
    types: [submitted]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  call-shared-dependabot:
    permissions:
      contents: write
      pull-requests: write
      issues: write
    name: Dependabot auto-merge triggered by ${{ github.event_name }}
    uses: jmuelbert/jm-github-standards/.github/workflows/shared-dependabot-merge.yml@9d6401a4329d7ec61ee987fdcf05ca2b369cea27 #v2.5.0
