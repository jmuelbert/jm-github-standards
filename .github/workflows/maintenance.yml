name: Scheduled maintenance trigger

# yamllint disable-line rule:truthy
on:
  schedule:
    - cron: 0 0 * * 1 # Every Monday at 4 am
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  maintenance:
    name: Cleanup
    permissions:
      contents: write
      issues: write
      pull-requests: write
    uses: jmuelbert/jm-github-standards/.github/workflows/shared-maintenance.yml@9d6401a4329d7ec61ee987fdcf05ca2b369cea27 #v2.5.0
    with:
      days-before-issue-stale: 30
      days-before-pr-stale: 45
      days-before-issue-close: 5
      days-before-pr-close: 10

  sync-labels:
    name: 🏷️ Sync Labels from Standards
    permissions:
      issues: write
      contents: read
    uses: jmuelbert/jm-github-standards/.github/workflows/shared-label-sync.yml@9d6401a4329d7ec61ee987fdcf05ca2b369cea27 #v2.5.0
