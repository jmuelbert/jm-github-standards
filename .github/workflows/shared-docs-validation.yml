name: Shared documents validation

# yamllint disable-line rule:truthy
on:
  workflow_call:

# Required permissions
# permissions:
#   contents: read

defaults:
  run:
    shell: bash

jobs:
  link-checker:
    name: Link checker
    runs-on: ubuntu-latest
    steps:
      - name: 🔒 Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: 🧰 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 💾 Cache Cargo registry and tools
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.cargo/bin/
            target/
          key: ${{ runner.os }}-cargo-lychee-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lychee-

      - name: ⚙️ Install latest Lychee CLI
        run: |
          if ! command -v lychee &> /dev/null; then
            cargo install lychee --quiet
          else
            echo "Lychee found in cache, skipping installation."
          fi

      - name: 🔗 Check links (Lychee)
        run: |
          lychee --format json --output results.json --quiet .
        continue-on-error: true

      - name: 🪄 Convert Lychee JSON to JUnit XML
        if: always()
        run: |
          if [ -f results.json ]; then
            echo '<?xml version="1.0" encoding="UTF-8"?>' > results.xml
            echo '<testsuites>' >> results.xml

            # Read stats and default to 0 if the keys are missing or null
            failures=$(jq '.stats.failures // 0' results.json)
            total=$(jq '.stats.total // 0' results.json)

            echo "  <testsuite name=\"📋 Lychee Link Check\" tests=\"$total\" failures=\"$failures\">" >> results.xml

            # If failures are greater than 0, map them as failed testcases
            if [ "$failures" -gt 0 ]; then
              jq -r '.fail_map | to_entries[] | .key as $url | .value[] | "    <testcase name=\"\($url)\" classname=\"\(.file)\">\n      <failure message=\"Broken link found in \(.file)\">URL: \($url) (Status: \(.status.code // \"Unknown\"))</failure>\n    </testcase>"' results.json >> results.xml
            else
              # Standard success case to keep the XML valid and green
              echo "    <testcase name=\"All links valid\" classname=\"lychee\" />" >> results.xml
            fi

            echo "  </testsuite>" >> results.xml
            echo '</testsuites>' >> results.xml
          else
            echo "No results.json found. Creating empty valid JUnit file."
            echo '<?xml version="1.0" encoding="UTF-8"?><testsuites><testsuite name="Lychee Link Check" tests="0" failures="0"></testsuite></testsuites>' > results.xml
          fi

      - name: Publish link check report
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: always()
        with:
          report_paths: results.xml
          annotate_only: false
          fail_on_failure: true # only fail in the end

  build-check:
    name: Build check
    runs-on: ubuntu-latest
    steps:
      - name: 🔒 Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: 🧰 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 🏗️ Build Docusaurus
        run: pnpm docs:build
