name: Shared release base
on:
  workflow_call:
    inputs:
      version:
        description: The version to release (e.g. v1.2.3)
        required: true
        type: string
      is_prerelease:
        type: boolean
        default: false
      changelog_config:
        type: string
        default: .github/config/cliff.toml

    # Required permissions (vom aufrufenden Workflow zu setzen)
    # permissions:
    #  contents: write
    #  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: 🔒 Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: 🧰 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: 📥 Install dependencies
        run: pnpm install --frozen-lockfile

      - name: 📝 Generate changelog
        run: |
          pnpm exec git-cliff --config "${{ inputs.changelog_config }}" \
            --tag "${{ inputs.version }}" \
            --output CHANGELOG.md

      - name: 🚀 Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG="${{ inputs.is_prerelease && '--prerelease' || '' }}"
          LATEST_FLAG="${{ !inputs.is_prerelease && '--latest' || '' }}"

          gh release create "${{ inputs.version }}" \
            --title "Release ${{ inputs.version }}" \
            --notes-file CHANGELOG.md \
            ${PRERELEASE_FLAG} \
            ${LATEST_FLAG}

      - name: 📤 Create changelog pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          # Nur weitermachen, wenn sich die CHANGELOG.md tatsächlich geändert hat
          if [ -z "$(git status --porcelain -- CHANGELOG.md)" ]; then
            echo "CHANGELOG.md unverändert, kein PR nötig."
            exit 0
          fi

          BASE_SHA="$(git rev-parse HEAD)"
          BRANCH="changelog/${VERSION}-${GITHUB_RUN_ID}"

          # Branch auf dem aktuellen Stand von main anlegen
          gh api -X POST "repos/${GITHUB_REPOSITORY}/git/refs" \
            -f ref="refs/heads/${BRANCH}" \
            -f sha="${BASE_SHA}"

          # Vorhandene Datei-SHA ermitteln (leer, falls Datei neu ist)
          FILE_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/contents/CHANGELOG.md?ref=${BRANCH}" --jq .sha 2>/dev/null || true)"

          CONTENT="$(base64 -w0 CHANGELOG.md)"

          # Commit über die API anlegen, dieser wird von GitHub signiert
          if [ -n "${FILE_SHA}" ]; then
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/CHANGELOG.md" \
              -f message="docs: update changelog for ${VERSION}" \
              -f content="${CONTENT}" \
              -f branch="${BRANCH}" \
              -f sha="${FILE_SHA}"
          else
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/contents/CHANGELOG.md" \
              -f message="docs: update changelog for ${VERSION}" \
              -f content="${CONTENT}" \
              -f branch="${BRANCH}"
          fi

          gh pr create \
            --repo "${GITHUB_REPOSITORY}" \
            --base main \
            --head "${BRANCH}" \
            --title "docs: update changelog for ${VERSION}" \
            --body "Automatisch erzeugtes Changelog für Release ${VERSION}."

      - name: 🏷️ Update Floating Tags
        if: inputs.is_prerelease == false
        run: |
          FULL_VERSION="${{ inputs.version }}"
          CLEAN_VER="${FULL_VERSION#v}"
          MAJOR="v$(echo "$CLEAN_VER" | cut -d. -f1)"
          MINOR="v$(echo "$CLEAN_VER" | cut -d. -f1,2)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -f "$MAJOR"
          git tag -f "$MINOR"
          git push origin "$MAJOR" "$MINOR" --force
