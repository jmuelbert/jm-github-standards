name: Shared release base
on:
  workflow_call:
    inputs:
      version:
        description: The version to release (e.g. v1.2.3)
        required: true
        type: string
      is_prerelease:
        type: boolean
        default: false
      changelog_config:
        type: string
        default: .github/config/cliff.toml
      doc_command:
        type: string
        default: ""
        description: Optional command to deploy documentation

    # Required permissions
    # permissions:
    #  contents: write
    #  pages: write
    #  id-token: write

defaults:
  run:
    shell: bash

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: 🔒 Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: 🧰 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 📝 Generate changelog
        run: |
          git-cliff --config ${{ inputs.changelog_config }} --output CHANGELOG.md

      - name: 📤 Commit CHANGELOG.md
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git diff-index --quiet HEAD || git commit -m "docs: update changelog for ${{ inputs.version }}"
          git push origin "${GITHUB_REF}"

      - name: 🚀 Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PRERELEASE_FLAG="${{ inputs.is_prerelease && '--prerelease' || '' }}"
          LATEST_FLAG="${{ !inputs.is_prerelease && '--latest' || '' }}"

          gh release create "${{ inputs.version }}" \
            --title "Release ${{ inputs.version }}" \
            --notes-file CHANGELOG.md \
            ${PRERELEASE_FLAG} \
            ${LATEST_FLAG}

      - name: 🏷️ Update Floating Tags
        if: inputs.is_prerelease == false
        run: |
          FULL_VERSION="${{ inputs.version }}"
          CLEAN_VER="${FULL_VERSION#v}"
          MAJOR="v$(echo "$CLEAN_VER" | cut -d. -f1)"
          MINOR="v$(echo "$CLEAN_VER" | cut -d. -f1,2)"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -f "$MAJOR"
          git tag -f "$MINOR"
          git push origin "$MAJOR" "$MINOR" --force

  deploy-docs:
    name: Deploy documentation
    needs: [release]
    if: success() && inputs.doc_command != ''
    runs-on: ubuntu-latest
    steps:
      - name: 🔒 Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: 🧰 Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          run_install: false

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: 📦 Setup Task
        uses: arduino/setup-task@v3
        with:
          version: 3.x

      - name: 📥 Install Tooling Dependencies
        run: task setup

      - name: 📘 Build documentation
        run: ${{ inputs.doc_command }} # Triggert deinen Astro-Build

      - name: 📤 Upload Pages Artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda990898657 # v3.0.1
        with:
          path: ./dist # Stelle sicher, dass dies mit deinem Astro outDir übereinstimmt

      - name: 🚀 Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
