version: "3"

vars:
  DOMAIN: jm-github-standards
  BASE_URL: https://jmuelbert.github.io/{{ .DOMAIN }}/
  SRC_DIR: scripts

tasks:
  # ============================================================
  # Internal helper
  # ============================================================
  _log:
    internal: true
    silent: true
    vars:
      SYMBOL:
        sh: |
          case "{{.TYPE}}" in
            info) echo "ℹ️" ;;
            success) echo "✅" ;;
            warn) echo "⚠️" ;;
            error) echo "❌" ;;
            *) echo "" ;;
          esac
    cmds:
      - echo "{{.SYMBOL}} [{{.TYPE | upper}}] {{.MSG}}"

  # ============================================================
  # Setup and maintenance
  # ============================================================
  setup:
    desc: Install project dependencies and Git hooks
    cmds:
      - task: _log
        vars: { MSG: Installing project dependencies..., TYPE: info }
      - pnpm self-update
      - pnpm install
      - pnpm exec lefthook install
      - vale sync
      - task: _log
        vars: { MSG: Setup complete., TYPE: success }

  maintenance:update-all:
    desc: Update project dependencies and run lint checks
    cmds:
      - pnpm update --latest
      - pnpm run docs:update
      - task: lint
      - task: _log
        vars:
          { MSG: Dependencies updated and lint checks complete., TYPE: success }

  clean:
    desc: Clean generated documentation files
    cmds:
      - pnpm run docs:clean

  clean-all:
    desc: Clean generated files and project caches
    cmds:
      - rm -rf .cache .tmp megalinter-reports
      - task: clean
      - task: _log
        vars: { MSG: Generated files and caches cleaned., TYPE: success }

  # ============================================================
  # Linting and formatting
  # ============================================================
  lint:
    desc: Run project and documentation checks
    cmds:
      - task: _log
        vars: { MSG: Running project checks..., TYPE: info }
      - pnpm run lint
      - task: lint:github-actions
      - task: lint:docs
      - task: lint:commit
      - task: _log
        vars: { MSG: All lint checks complete., TYPE: success }

  lint:github-actions:
    desc: Lint GitHub Actions workflow files
    cmds:
      - go run github.com/rhysd/actionlint/cmd/actionlint@latest .github/workflows/*.yml

  lint:docs:
    desc: Check spelling, style, and links across documentation
    cmds:
      - pnpm run docs:cspell
      - vale README.md .github/CONTRIBUTING.md .github/CODE_OF_CONDUCT.md
      - vale docs
      - task: check:links

  lint:commit:
    desc: Validate the latest commit message
    cmds:
      - pnpm exec commitlint --from HEAD~1 --to HEAD --verbose

  lint:yaml:
    desc: Run the configured YAML lint check
    cmds:
      - pnpm run lint:yaml

  lint:toml:
    desc: Lint TOML files
    cmds:
      - pnpm run lint:toml

  format:
    desc: Format code and TOML files
    cmds:
      - pnpm run format

  format:toml:
    desc: Format TOML files
    cmds:
      - pnpm run format:toml

  format-code:
    desc: Format code with Biome
    cmds:
      - pnpm run format:biome

  lint-code:
    desc: Lint code with Biome
    cmds:
      - pnpm run lint:biome

  # ============================================================
  # Documentation
  # ============================================================
  docs:check:
    desc: Check documentation before building
    cmds:
      - pnpm run docs:lint
      - vale docs
      - task: check:links

  docs:build:
    desc: Check and build production documentation
    deps: [docs:check]
    cmds:
      - pnpm run docs:build

  docs:dev:
    desc: Start the documentation development server
    cmds:
      - pnpm run docs:dev

  check:links:
    desc: Check links in the repository
    cmds:
      - |
        if ! command -v lychee >/dev/null 2>&1; then
          echo "lychee is not installed. Install it with: cargo install lychee"
          exit 1
        fi
        lychee .

  # ============================================================
  # Heavy linting
  # ============================================================
  megalinter:
    desc: Run MegaLinter in Docker
    cmds:
      - rm -rf megalinter-reports
      - |
        docker run --rm \
          -v "$(pwd)":/tmp/lint \
          -e DISABLE_ERRORS_ON_LINTER="none" \
          -e JSON_REPORTER=false \
          -e SHOW_ELAPSED_TIME=true \
          -e VALIDATE_ALL_CODEBASE=true \
          -e MEGALINTER_CONFIG=/.github/config/.mega-linter.yml \
          -e APPLY_FIXES=true \
          oxsecurity/megalinter:latest

  # ============================================================
  # Other project tasks
  # ============================================================
  build:
    desc: Build the project
    cmds:
      - task: _log
        vars: { MSG: No general build command is configured., TYPE: warn }

  test:
    desc: Run tests
    cmds:
      - task: _log
        vars: { MSG: No test command is configured., TYPE: warn }

  fix:reuse:
    desc: Add license headers to source files
    cmds:
      - echo "REUSE annotation is not configured yet."

  install-project:
    desc: Install project dependencies
    cmds:
      - pnpm install

  dev:
    desc: Start development mode
    cmds:
      - pnpm run docs:dev
