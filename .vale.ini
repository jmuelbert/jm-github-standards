# Core-Settings
StylesPath = .github/config/styles

# The minimum alert level to display
MinAlertLevel = suggestion

# Vocabulary managment
Vocab = Docs, Community, TechStack, Legal

# List of packages to install
Packages = Microsoft, Readability, proselint

[formats]
# mapping of file extensions to styles
mdx = md
adoc = asciidoc

[formats]
astro = html

[*.astro]
TokenIgnores = ("@astrojs/starlight/components/Footer\.astro")

[*]
# Globaler Fallback: Falls eine Datei keiner spezifischen Regel unten entspricht,
# wird hier nichts geprüft.
BasedOnStyles = Vale

[*.md]
BasedOnStyles = Microsoft, proselint, Readability

[**/.github/CODE_OF_CONDUCT.md]
BasedOnStyles =
Vale.Spelling = NO

[*.txt]
BasedOnStyles = Microsoft, proselint

[*.{adoc,asciidoc}]
BasedOnStyles = Microsoft, proselint

[**/de/**]
BasedOnStyles =

[**/es/**]
BasedOnStyles =

[**/fr/**]
BasedOnStyles =

[**/it/**]
BasedOnStyles =

[**/dist/**]
BasedOnStyles =

[*.{jsonc,json,svg,png,jpg,jpeg,gif,ico,css,js,ts,tsx,jsx,xml,yaml,yml,toml,lock,lockb,sh,bat,ps1}]
BasedOnStyles =
